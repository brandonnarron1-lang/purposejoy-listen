name: Direct YouTube uploader tests

on:
  pull_request:
    paths:
      - 'scripts/shorts/**'
      - '.github/workflows/shorts-tests.yml'

permissions:
  contents: read

concurrency:
  group: shorts-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test without credentials or Google API calls
        run: node --test scripts/shorts/*.test.cjs
